name: Compilar APK CIVITAS (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-apk:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Keystore Fijo para Release y Firebase
        run: |
          if [ ! -f android/app/civitas.keystore ]; then
            echo "Generando keystore fijo de release para CIVITAS..."
            keytool -genkeypair -v \
              -keystore android/app/civitas.keystore \
              -alias civitas \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass civitas123 \
              -keypass civitas123 \
              -dname "CN=CIVITAS, OU=Seguridad, O=Vecinos, L=Antofagasta, ST=Antofagasta, C=CL"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/civitas.keystore
            git commit -m "chore(keystore): guardar keystore fijo para Firebase SHA-1 [skip ci]" || true
            git push origin main || true
          fi

          echo "Extrayendo huellas digitales SHA-1 y SHA-256..."
          KEYTOOL_OUT=$(keytool -list -v -keystore android/app/civitas.keystore -storepass civitas123 -alias civitas)
          SHA1_FINGERPRINT=$(echo "$KEYTOOL_OUT" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_FINGERPRINT=$(echo "$KEYTOOL_OUT" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          
          echo "SHA1=$SHA1_FINGERPRINT" >> $GITHUB_ENV
          echo "SHA256=$SHA256_FINGERPRINT" >> $GITHUB_ENV
          
          echo "=========================================="
          echo "CIVITAS RELEASE KEYSTORE FINGERPRINTS"
          echo "SHA-1:   $SHA1_FINGERPRINT"
          echo "SHA-256: $SHA256_FINGERPRINT"
          echo "=========================================="

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Obtener Dependencias
        run: flutter pub get

      - name: Ejecutar Suite de Pruebas Unitarias
        run: flutter test

      - name: Validar y Preparar Configuración de Google Maps API Key
        run: |
          if [ -z "${{ secrets.MAPS_API_KEY }}" ]; then
            echo "::warning::El Secret 'MAPS_API_KEY' no está configurado en GitHub. El APK compilará con clave placeholder y los mapas de Google aparecerán en gris en el teléfono hasta agregar el Secret."
            echo "MAPS_CONFIG_STATUS=⚠️ Sin configurar (Requiere Secret MAPS_API_KEY)" >> $GITHUB_ENV
          else
            echo "Clave de Google Maps detectada correctamente en GitHub Secrets."
            echo "MAPS_CONFIG_STATUS=✅ Configurada" >> $GITHUB_ENV
          fi

      - name: Compilar APK en Modo Release
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Publicar Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: civitas-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publicar Release para Descarga Directa en Celular
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          git push --delete origin v1.0.0 || true
          gh release create v1.0.0 build/app/outputs/flutter-apk/app-release.apk \
            --title "CIVITAS APK v1.0.0 (Instalador Android)" \
            --notes "### Descarga directa de CIVITAS APK
          Abre el archivo \`app-release.apk\` en tu teléfono Android para instalar o actualizar la aplicación.

          ---
          ### Estado de Configuración de Google Maps
          * **Estado de la Clave:** ${{ env.MAPS_CONFIG_STATUS }}
          * **¿Por qué el mapa se ve gris/blanco en la app?**
            Google Maps para Android no descarga los mosaicos de calles sin una clave de API activa de Google Cloud con facturación habilitada.

          ---
          ### Huellas Digitales del Certificado de Firma (Keystore Release)
          * **Package Name:** \`com.civitas.app\`
          * **Huella Digital SHA-1:** \`${{ env.SHA1 }}\`
          * **Huella Digital SHA-256:** \`${{ env.SHA256 }}\`

          > **Cómo habilitar el Mapa de Google Maps en 3 pasos:**
          > 1. En [Google Cloud Console](https://console.cloud.google.com/): Habilita la API **Maps SDK for Android** y vincula una cuenta de facturación (tienes \$200 USD gratis al mes).
          > 2. En tu API Key de Google Cloud: Agrega restricción de Android con:
          >    * Nombre del paquete: \`com.civitas.app\`
          >    * SHA-1: \`${{ env.SHA1 }}\`
          > 3. En GitHub: Ve a tu repositorio > **Settings > Secrets and variables > Actions** y crea un nuevo secret llamado \`MAPS_API_KEY\` con tu clave.
          >    *(GitHub compilará automáticamente una nueva versión y el mapa se verá inmediatamente)*.

          > **Instrucciones para Firebase Console:**
          > 1. Ve a tu proyecto en [Firebase Console](https://console.firebase.google.com/).
          > 2. Entra a **Configuración del proyecto > General > Tus apps > Android (com.civitas.app)**.
          > 3. Toca **Agregar huella digital** y pega el SHA-1 indicado arriba (\`${{ env.SHA1 }}\`).
          > 4. Descarga tu archivo \`google-services.json\` oficial y colócalo en la carpeta \`android/app/\` del proyecto."
