name: Compilar APK CIVITAS (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-apk:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Keystore Fijo para Release y Firebase
        run: |
          if [ ! -f android/app/civitas.keystore ]; then
            echo "Generando keystore fijo de release para CIVITAS..."
            keytool -genkeypair -v \
              -keystore android/app/civitas.keystore \
              -alias civitas \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass civitas123 \
              -keypass civitas123 \
              -dname "CN=CIVITAS, OU=Seguridad, O=Vecinos, L=Antofagasta, ST=Antofagasta, C=CL"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add android/app/civitas.keystore
            git commit -m "chore(keystore): guardar keystore fijo para Firebase SHA-1 [skip ci]" || true
            git push origin main || true
          fi

          echo "Extrayendo huellas digitales SHA-1 y SHA-256..."
          KEYTOOL_OUT=$(keytool -list -v -keystore android/app/civitas.keystore -storepass civitas123 -alias civitas)
          SHA1_FINGERPRINT=$(echo "$KEYTOOL_OUT" | grep "SHA1:" | head -n 1 | awk '{print $2}')
          SHA256_FINGERPRINT=$(echo "$KEYTOOL_OUT" | grep "SHA256:" | head -n 1 | awk '{print $2}')
          
          echo "SHA1=$SHA1_FINGERPRINT" >> $GITHUB_ENV
          echo "SHA256=$SHA256_FINGERPRINT" >> $GITHUB_ENV
          
          echo "=========================================="
          echo "CIVITAS RELEASE KEYSTORE FINGERPRINTS"
          echo "SHA-1:   $SHA1_FINGERPRINT"
          echo "SHA-256: $SHA256_FINGERPRINT"
          echo "=========================================="

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Obtener Dependencias
        run: flutter pub get

      - name: Ejecutar Suite de Pruebas Unitarias
        run: flutter test

      - name: Compilar APK en Modo Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Publicar Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: civitas-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publicar Release para Descarga Directa en Celular
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extraer versión y build number dinámicamente de pubspec.yaml
          RAW_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          APP_VERSION=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          BUILD_NUM=$(echo "$RAW_VERSION" | cut -d'+' -f2)
          TAG_NAME="v${APP_VERSION}"

          echo "Publicando Release para versión: $APP_VERSION (Build $BUILD_NUM), Tag: $TAG_NAME"

          gh release delete "$TAG_NAME" --yes || true
          git push --delete origin "$TAG_NAME" || true

          gh release create "$TAG_NAME" build/app/outputs/flutter-apk/app-release.apk \
            --title "CIVITAS APK v${APP_VERSION} (Build ${BUILD_NUM}) - Instalador Android" \
            --notes "### Descarga directa de CIVITAS APK v${APP_VERSION} (Build ${BUILD_NUM})
          Abre el archivo \`app-release.apk\` en tu teléfono Android para instalar o actualizar la aplicación.

          ---
          ### Mejoras en esta versión v1.0.6 (Correcciones Críticas & Red Social de Confianza):
          * **Eliminación de Bucle Infinito de Credenciales:** Manejo de excepciones robusto con timeouts de 8-12s y bloques \`finally\` garantizados para evitar bloqueos de carga indefinida durante el registro, inicio de sesión y onboarding.
          * **Eliminación Atómica de Contactos de Confianza:** Actualización instantánea en la interfaz (optimistic UI) y eliminación en Firestore mediante \`FieldValue.arrayRemove()\` y borrado de subcolección.
          * **Solicitudes de Confianza en Tiempo Real con Credencial:** Transmisión reactiva mediante streams (\`solicitudes_confianza\`), tarjeta de notificación con credencial digital CIVITAS oficial del emisor y opciones de Aceptar/Rechazar.
          * **Alertas por Proximidad en Tiempo Real (Geofencing 500m):** Motor local con fórmula de Haversine sobre el flujo de incidentes de Firestore para disparar notificaciones y vibración háptica de alta prioridad dentro de un radio de 500m.
          * **Filtro de Contactos Estilo WhatsApp e Invitaciones Comunitarias:** Cruce automático de contactos telefónicos con la base de datos de usuarios de CIVITAS; despliegue de badge 'En CIVITAS' con botón 'Agregar a Red' para registrados y botón 'Invitar' con enlace de descarga para nuevos vecinos.
          * **Módulos de Seguridad Avanzada Previo a Defensa v1.0.5/v1.0.4:** Verificación institucional, grabación ambiental SOS sigilosa, código coacción por volumen y clustering en mapa OpenStreetMap.

          ---
          ### Huellas Digitales del Certificado de Firma (Keystore Release)
          * **Package Name:** \`com.civitas.app\`
          * **Huella Digital SHA-1:** \`${{ env.SHA1 }}\`
          * **Huella Digital SHA-256:** \`${{ env.SHA256 }}\`

          > **Instrucciones para Firebase Console:**
          > 1. Ve a tu proyecto en [Firebase Console](https://console.firebase.google.com/).
          > 2. Entra a **Configuración del proyecto > General > Tus apps > Android (com.civitas.app)**.
          > 3. Toca **Agregar huella digital** y pega el SHA-1 indicado arriba (\`${{ env.SHA1 }}\`).
          > 4. Descarga tu archivo \`google-services.json\` oficial y colócalo en la carpeta \`android/app/\` del proyecto."
