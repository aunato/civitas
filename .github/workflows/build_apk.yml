name: Compilar APK CIVITAS (Release)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_NODE24: "true"

jobs:
  build-apk:
    name: Compilar APK Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 (JDK Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Obtener Dependencias
        run: flutter pub get

      - name: Ejecutar Suite de Pruebas Unitarias
        run: flutter test

      - name: Compilar APK en Modo Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Publicar Artefacto Descargable
        uses: actions/upload-artifact@v4
        with:
          name: civitas-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publicar Release para Descarga Directa en Celular
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          git push --delete origin v1.0.0 || true
          gh release create v1.0.0 build/app/outputs/flutter-apk/app-release.apk \
            --title "CIVITAS APK v1.0.0 (Instalador Android)" \
            --notes "Descarga directa de CIVITAS APK para instalar y probar en tu celular Android. Abre el archivo app-release.apk en tu teléfono para instalar la aplicación."
